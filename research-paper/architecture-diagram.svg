<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Arial, Helvetica, sans-serif">
  <!-- Solid white background -->
  <rect x="0" y="0" width="1200" height="860" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111111">
    Figure 1: Tools-Prediction-Based Algorithm Architecture (GenAI + RAG Pipeline)
  </text>
  <text x="600" y="62" text-anchor="middle" font-size="14" fill="#333333">
    Case Study: FishOnBid — Distributed Intelligence Auction Platform
  </text>

  <!-- Layer 1: Client / Presentation -->
  <rect x="40" y="90" width="1120" height="95" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2" rx="8"/>
  <text x="60" y="115" font-size="14" font-weight="bold" fill="#1F4E79">PRESENTATION LAYER (React 19 + Vite + Tailwind + PWA)</text>

  <rect x="70" y="130" width="180" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" rx="6"/>
  <text x="160" y="155" text-anchor="middle" font-size="12" fill="#111111">Snap &amp; Bid (Image Capture)</text>

  <rect x="270" y="130" width="180" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" rx="6"/>
  <text x="360" y="155" text-anchor="middle" font-size="12" fill="#111111">Auction Feed (WebSocket)</text>

  <rect x="470" y="130" width="180" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" rx="6"/>
  <text x="560" y="155" text-anchor="middle" font-size="12" fill="#111111">AI Price Suggestion UI</text>

  <rect x="670" y="130" width="180" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" rx="6"/>
  <text x="760" y="155" text-anchor="middle" font-size="12" fill="#111111">Live Bidding Console</text>

  <rect x="870" y="130" width="270" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" rx="6"/>
  <text x="1005" y="155" text-anchor="middle" font-size="12" fill="#111111">Admin &amp; Explainability Dashboard</text>

  <!-- Arrow down to API gateway -->
  <line x1="600" y1="185" x2="600" y2="215" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: API Gateway -->
  <rect x="40" y="215" width="1120" height="60" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2" rx="8"/>
  <text x="60" y="240" font-size="14" font-weight="bold" fill="#1F4E79">API GATEWAY (Spring Boot 3.5 • JWT Auth • REST / STOMP WebSocket)</text>
  <text x="60" y="260" font-size="11" fill="#333333">AuctionController • AiController • MarketDataController • AuthController • AdminController</text>

  <!-- Arrow down to core services -->
  <line x1="280" y1="275" x2="280" y2="310" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="275" x2="600" y2="310" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="920" y1="275" x2="920" y2="310" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: AI Orchestrator Layer -->
  <rect x="40" y="310" width="1120" height="210" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2" rx="8"/>
  <text x="60" y="335" font-size="14" font-weight="bold" fill="#1F4E79">AI ORCHESTRATOR — Tools-Prediction Algorithm (Vision + RAG + Pricing)</text>

  <!-- Tool 1: Vision -->
  <rect x="70" y="355" width="300" height="140" fill="#FFFFFF" stroke="#B4513B" stroke-width="2" rx="8"/>
  <text x="220" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#B4513B">TOOL 1 — GenAI Vision Service</text>
  <text x="85" y="402" font-size="11" fill="#111111">Model: Google Gemini 1.5 Flash</text>
  <text x="85" y="420" font-size="11" fill="#111111">Input: Base64 fish image + prompt</text>
  <text x="85" y="438" font-size="11" fill="#111111">Output: species, freshness(0-100),</text>
  <text x="85" y="454" font-size="11" fill="#111111">quality grade, confidence(0-1)</text>
  <text x="85" y="474" font-size="11" fill="#111111">Prompt: Marine biologist persona</text>
  <text x="85" y="490" font-size="11" fill="#111111">Fallback: deterministic mock</text>

  <!-- Tool 2: RAG -->
  <rect x="390" y="355" width="300" height="140" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2" rx="8"/>
  <text x="540" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">TOOL 2 — RAG Retrieval Service</text>
  <text x="405" y="402" font-size="11" fill="#111111">Embeddings: 5-D (fish type, location,</text>
  <text x="405" y="418" font-size="11" fill="#111111">price, quantity, recency)</text>
  <text x="405" y="438" font-size="11" fill="#111111">Vector Store: in-memory (cosine sim.)</text>
  <text x="405" y="456" font-size="11" fill="#111111">Lookback Window: 90 days</text>
  <text x="405" y="474" font-size="11" fill="#111111">Refresh Cycle: hourly index rebuild</text>
  <text x="405" y="490" font-size="11" fill="#111111">Output: top-k similar auctions</text>

  <!-- Tool 3: Pricing -->
  <rect x="710" y="355" width="430" height="140" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="2" rx="8"/>
  <text x="925" y="378" text-anchor="middle" font-size="13" font-weight="bold" fill="#6A1B9A">TOOL 3 — AI Pricing &amp; Prediction Engine</text>
  <text x="725" y="402" font-size="11" fill="#111111">Trust Score = BaseWeight × RecencyDecay × VolumeFactor</text>
  <text x="725" y="420" font-size="11" fill="#111111">RecencyDecay = e^(−0.05 × daysOld)</text>
  <text x="725" y="438" font-size="11" fill="#111111">Base weights: Govt API 1.5× • Platform 1.0× • Demo 0.5×</text>
  <text x="725" y="456" font-size="11" fill="#111111">Hybrid = 0.70·internalPrice + 0.30·externalPrice</text>
  <text x="725" y="474" font-size="11" fill="#111111">Freshness Multiplier = 0.8 + (score/100)·0.4  (±40%)</text>
  <text x="725" y="490" font-size="11" fill="#111111">Output: min / suggested / max with confidence band</text>

  <!-- Horizontal arrows between tools -->
  <line x1="370" y1="425" x2="390" y2="425" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="425" x2="710" y2="425" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Audit -->
  <rect x="460" y="505" width="280" height="30" fill="#FFFFFF" stroke="#555555" stroke-width="1.5" rx="6"/>
  <text x="600" y="524" text-anchor="middle" font-size="11" fill="#111111">AiDecisionLog (audit • traceability • explainability)</text>

  <!-- Down arrow to data layer -->
  <line x1="600" y1="535" x2="600" y2="570" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: Data Sources -->
  <rect x="40" y="570" width="1120" height="170" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2" rx="8"/>
  <text x="60" y="595" font-size="14" font-weight="bold" fill="#1F4E79">DATA &amp; INTEGRATION LAYER</text>

  <!-- MySQL -->
  <rect x="70" y="615" width="230" height="110" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" rx="6"/>
  <text x="185" y="636" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">MySQL 8.0</text>
  <text x="85" y="660" font-size="11" fill="#111111">• Auctions, Bids, Users</text>
  <text x="85" y="678" font-size="11" fill="#111111">• AiDecisionLog</text>
  <text x="85" y="696" font-size="11" fill="#111111">• Pessimistic write locks</text>
  <text x="85" y="714" font-size="11" fill="#111111">• Event-sourced domain</text>

  <!-- Govt APIs -->
  <rect x="320" y="615" width="230" height="110" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" rx="6"/>
  <text x="435" y="636" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Government Fisheries APIs</text>
  <text x="335" y="660" font-size="11" fill="#111111">• data.gov.in — Mandi prices</text>
  <text x="335" y="678" font-size="11" fill="#111111">• AgMarkNet (77M records)</text>
  <text x="335" y="696" font-size="11" fill="#111111">• Cached (ConcurrentHashMap)</text>
  <text x="335" y="714" font-size="11" fill="#111111">• Baseline fallback prices</text>

  <!-- Gemini -->
  <rect x="570" y="615" width="230" height="110" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" rx="6"/>
  <text x="685" y="636" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Google Gemini API</text>
  <text x="585" y="660" font-size="11" fill="#111111">• 1.5 Flash multimodal</text>
  <text x="585" y="678" font-size="11" fill="#111111">• 1,500 free req/day</text>
  <text x="585" y="696" font-size="11" fill="#111111">• $0.075 / 1M tokens</text>
  <text x="585" y="714" font-size="11" fill="#111111">• Resilience4j circuit breaker</text>

  <!-- Cloudinary -->
  <rect x="820" y="615" width="320" height="110" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" rx="6"/>
  <text x="980" y="636" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Cloudinary &amp; Realtime Infra</text>
  <text x="835" y="660" font-size="11" fill="#111111">• Cloudinary video CDN (SHA-1 signed)</text>
  <text x="835" y="678" font-size="11" fill="#111111">• STOMP / SockJS WebSocket push</text>
  <text x="835" y="696" font-size="11" fill="#111111">• Topics: /topic/auction/{id}, /topic/bids</text>
  <text x="835" y="714" font-size="11" fill="#111111">• Auto-reconnect, polling fallback</text>

  <!-- Feedback loop -->
  <line x1="1160" y1="655" x2="1180" y2="655" stroke="#111111" stroke-width="2"/>
  <line x1="1180" y1="655" x2="1180" y2="425" stroke="#111111" stroke-width="2"/>
  <line x1="1180" y1="425" x2="1140" y2="425" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1190" y="540" font-size="10" fill="#333333" transform="rotate(90 1190 540)">feedback</text>

  <!-- Footer legend -->
  <text x="60" y="780" font-size="12" font-weight="bold" fill="#111111">Prediction Pipeline:</text>
  <text x="60" y="800" font-size="11" fill="#333333">Image → Vision (species, freshness) → RAG (historical + Govt context) → Pricing Engine (trust-weighted fusion) → Suggested Price Band → Auction</text>
  <text x="60" y="820" font-size="11" fill="#333333">Every decision is logged (AiDecisionLog) with inputs, processing time, and rationale — enabling explainable, auditable GenAI in production.</text>
  <text x="60" y="840" font-size="11" fill="#333333">Domain events (AuctionCreated, BidPlaced, AuctionClosed) drive real-time UI and downstream analytics.</text>

  <!-- Arrow marker def -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
  </defs>
</svg>
